<script>
(function () {
  var cats = document.querySelectorAll('.quarto-category');
  var program = null;
  var isAlumni = false;
  var graduationYear = null;
  for (var i = 0; i < cats.length; i++) {
    var text = cats[i].textContent.trim().toUpperCase();
    if (text.startsWith('PROGRAM: ')) {
      program = text.replace('PROGRAM: ', '');
    }
    if (text === 'ALUMNI') {
      isAlumni = true;
    }
    if (text.startsWith('CLASS OF: ')) {
      graduationYear = text.replace('CLASS OF: ', '');
    }
  }
  var href, label;
  if (isAlumni && program === 'MS') {
    href = '../../../ms-alumni.html';
    label = 'Back to MS Alumni';
  } else if (isAlumni && program === 'MDSH') {
    href = '../../../mdsh-alumni.html';
    label = 'Back to MDSH Alumni';
  } else if (isAlumni && program === 'PHD') {
    href = '../../../phd-alumni.html';
    label = 'Back to PhD Alumni';
  } else if (program === 'PHD') {
    href = '../../phd-students.html';
    label = 'Back to PhD Students';
  } else if (program === 'MDSH') {
    href = '../../mdsh-students.html';
    label = 'Back to MDSH Students';
  } else if (program === 'MS') {
    href = '../../ms-students.html';
    label = 'Back to MS Students';
  }

  // Link every displayed profile category directly to the matching directory filter.
  // This keeps the links working even when the profile is not adjacent to its
  // directory listing in the published site.
  if (href) {
    for (var j = 0; j < cats.length; j++) {
      var category = cats[j];
      var categoryText = category.textContent.trim();
      if (!categoryText) continue;

      var categoryLink = document.createElement('a');
      categoryLink.href = href + '#category=' + encodeURIComponent(categoryText);
      categoryLink.setAttribute('aria-label', 'Show ' + categoryText + ' in the directory');
      while (category.firstChild) {
        categoryLink.appendChild(category.firstChild);
      }
      category.appendChild(categoryLink);
    }
  }

  if (href) {
    var btn = document.createElement('a');
    btn.href = href;
    btn.className = 'back-to-directory';
    btn.innerHTML = '&#8592; ' + label;
    var content = document.querySelector('.about-contents');
    if (content) {
      content.insertBefore(btn, content.firstChild);
    }
  }
})();
</script>
