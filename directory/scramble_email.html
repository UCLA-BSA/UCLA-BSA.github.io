<!-- this script builds an email only when rendered -->
<!-- emails are not directly contained in the .html file -->
<script type="text/javascript">
function scrambleIt(domain, user) {
  document.write('<a href="mailto:' + user + '@' + domain + '">' + user + '@' + domain + '</a>');
}
</script>

<!-- ════════════════════════════════════════════════════════════════════
     Header-height CSS variable (site-wide — not something you need to
     edit)
     ════════════════════════════════════════════════════════════════════
     Quarto's own JS measures the floating navbar's real (dynamic)
     height and sets it as an inline `padding-top` directly on `<body>`
     — that's the one source of truth for "how much space is reserved
     above the page content for the fixed header," and it changes with
     the header's own content (a bigger logo, nav links wrapping to a
     second row on a narrow screen, etc.). `.hero-banner`/`.page-hero`
     bands (styles.css) need that exact number, as a negative margin,
     to sit flush under the transparent floating nav with no gap.

     Rather than re-measuring the header ourselves (which can race
     against Quarto's own measurement and read a stale value), this
     just watches `<body>`'s `style` attribute directly with a
     MutationObserver and mirrors whatever padding-top Quarto set into
     a `--bsa-header-h` CSS variable — so it can never drift out of
     sync, regardless of load order or timing.

     This script sits in `<head>` (via include-in-header), which runs
     before `<body>` exists yet — so the observer setup is deferred to
     DOMContentLoaded rather than attached immediately. -->
<script type="text/javascript">
document.addEventListener('DOMContentLoaded', function () {
  function syncHeaderHeight() {
    var padTop = document.body.style.paddingTop;
    if (padTop) {
      document.documentElement.style.setProperty('--bsa-header-h', padTop);
    }
  }
  syncHeaderHeight();
  new MutationObserver(syncHeaderHeight)
    .observe(document.body, { attributes: true, attributeFilter: ['style'] });
  window.addEventListener('resize', syncHeaderHeight);
});
</script>
