<script>
(function () {
  'use strict';
  function buildAccordion() {
    var container = document.querySelector('.quarto-listing-category');
    if (!container) return;

    var allItems = Array.from(container.querySelectorAll('.category'));
    if (!allItems.length) return;
    
    var groups = { Advisor: [], Cohort: [] };
    var anyActive = false; // Track if ANY filter is active globally

    allItems.forEach(function (el) {
      var text = el.textContent.trim();
      if (el.classList.contains('active')) anyActive = true; 

      if (text.startsWith('Advisor: ')) groups.Advisor.push(el);
      else if (text.startsWith('Cohort: ')) groups.Cohort.push(el);
      else if (text.startsWith('Program: ')) el.remove();
    });

    groups.Advisor.concat(groups.Cohort).forEach(function (el) { el.remove(); });

    ['Advisor', 'Cohort'].forEach(function (groupName) {
      var items = groups[groupName];
      if (!items.length) return;
      
      var wrapper = document.createElement('div');
      wrapper.className = 'category-accordion-group';
      
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-accordion-header';
      btn.innerHTML = '<span class="accordion-label">' + groupName + '</span><span class="accordion-arrow">&#8250;</span>';
      
      var list = document.createElement('div');
      list.className = 'category-accordion-items';
      list.style.display = 'none';

      // Sort items (Advisors/Cohorts)
      items.sort(function(a, b) {
        var aText = a.textContent.trim().replace(groupName + ': ', '');
        var bText = b.textContent.trim().replace(groupName + ': ', '');
        if (aText === 'Not Listed') return 1;
        if (bText === 'Not Listed') return -1;
        return aText.localeCompare(bText);
      });

      // --- AUTO-EXPAND LOGIC ---
      // Check if this specific group contains the active filter
      var hasActiveInGroup = items.some(function(el) {
        return el.classList.contains('active');
      });

      items.forEach(function (el) {
        var label = el.textContent.trim().replace(groupName + ': ', '');
        el.textContent = label;
        list.appendChild(el);
      });

      // If a filter is active in this group, open it by default
      if (hasActiveInGroup) {
        list.style.display = 'block';
        btn.setAttribute('aria-expanded', 'true');
        btn.querySelector('.accordion-arrow').classList.add('open');
      }

      btn.addEventListener('click', function () {
        var expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        list.style.display = expanded ? 'none' : 'block';
        btn.querySelector('.accordion-arrow').classList.toggle('open', !expanded);
      });

      wrapper.appendChild(btn);
      wrapper.appendChild(list);
      container.appendChild(wrapper);
    });

    // --- UPDATED CLEAR BUTTON ---
    var clearBtn = document.createElement('button');
    clearBtn.id = 'clear-all-filters';
    clearBtn.className = 'btn btn-link btn-sm mt-2 text-decoration-none';
    
    // Show button only if a filter is active
    var displayStyle = anyActive ? 'block' : 'none';
    clearBtn.style.cssText = 'display:' + displayStyle + '; color: #6c757d; font-size: 0.8rem; padding-left: 6px;';
    
    clearBtn.innerHTML = '✕ Clear Filters';
    clearBtn.onclick = function() {
        if (typeof clearCategoryFilter === 'function') {
            clearCategoryFilter();
        }
    };
    container.appendChild(clearBtn);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildAccordion);
  } else {
    setTimeout(buildAccordion, 0);
  }
})();
</script>
