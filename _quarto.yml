project:
  type: website
  output-dir: docs
  # Newsletter URLs are generated in index.qmd's JavaScript, so register the
  # PDFs as site resources instead of relying on Quarto to discover the links.
  resources:
    - about/newsletter/articles/**
  #pre-render: directory/make_profiles.R # comment out if you don't need to create student profiles each time
  render:
    - "!*.md"
    - "!*test*.qmd"
    - "*.qmd"
    # - "!stats/stats.qmd"
website:
  title: "Biostatistics Student Association at UCLA"
  favicon: images/icon.png
  search: false
  navbar:
    # EDITABLE: swap this file to change the logo shown in the header.
    # Just replace images/bsa_logo.png with a new image of the same
    # name, or point this at a different path — no CSS change needed.
    logo: images/bsa_logo.png
    left:
      - href: index.qmd
        text: Home
      - href: index.qmd#about
        text: About
      - href: directory/directory.qmd
        text: Student Directory
      # - href: directory/alumni.qmd
      #   text: Alumni
      - href: events/events.qmd
        text: Events
    right:
      - href: https://ph.ucla.edu/departments/biostatistics
        text: UCLA Biostatistics
        target: _blank
  page-footer:
    right:
      - icon: github
        href: https://github.com/UCLA-BSA/UCLA-BSA.github.io
        target: _blank
    

format:
  html:
    theme:
      - cosmo
    css: styles.css
    toc: true
    grid: 
      body-width: 2000px
      sidebar-width: 200px
      margin-width: 300px
    include-in-header: directory/scramble_email.html
    include-after-body: footer.html
    link-external-newwindow: true
    link-external-filter: '.*'
