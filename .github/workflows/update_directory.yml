name: Update and Build Biostatistics Student Directory

on:
  schedule:
    # Runs at 09:00 every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for the 'amend' logic to check previous commits

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::googledrive
            any::googlesheets4
            any::glue
            any::dotenv
            any::here
            any::writexl
            any::readxl
          cache-version: 1

      - name: Run R script to generate profiles
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
          STUDENT_DIRECTORY_URL: ${{ secrets.STUDENT_DIRECTORY_URL }}
        run: Rscript directory/workflow_make_profiles.R

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Build Quarto site
        run: quarto render

      - name: Commit and push .qmd profiles (Clean History)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add directory/profiles/ directory/images/
          
          if [ -z "$(git status --porcelain directory/profiles/ directory/images/)" ]; then
            echo "No new profiles to commit"
          elif [ "$(git log -1 --pretty=%an)" = "github-actions[bot]" ]; then
            git commit --amend --no-edit
            git push origin main --force
          else
            git commit -m "Auto-update student directory profiles"
            git push origin main
          fi

      - name: Publish to GitHub Pages (Action)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}