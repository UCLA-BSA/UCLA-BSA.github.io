name: Update and Build Biostatistics Student Directory

on:
  schedule:
    # Runs weekly on Sunday around 11:59 pm
    - cron: '59 6 * * 0'
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'Force re-download all images'
        type: boolean
        default: false
      force_publish:
        description: 'Force publish to GitHub Pages even without new commits'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.DIRECTORY_BOT_APP_ID }}
          private_key: ${{ secrets.DIRECTORY_BOT_APP_PRIVATE_KEY }}
          
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }} 
          fetch-depth: 0
          
      # ---- restore cache ----
      - name: Restore images cache
        if: ${{ github.event.inputs.force_redownload != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            directory/images
            directory/.image_cache.json
          key: directory-images-${{ github.run_id }}
          restore-keys: |
            directory-images-
            
       # ---- clear cache if force redownload ----
      - name: Clear images for force redownload
        if: ${{ github.event.inputs.force_redownload == 'true' }}
        run: |
          rm -rf directory/images
          rm -f directory/.image_cache.json

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::googledrive
            any::googlesheets4
            any::glue
            any::dotenv
            any::here
            any::writexl
            any::readxl
            any::jsonlite
          cache-version: 1

      - name: Run R script to generate profiles
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
          STUDENT_DIRECTORY_URL: ${{ secrets.STUDENT_DIRECTORY_URL }}
        run: Rscript directory/make_profiles.R
        
      - name: Compress images in directory
        run: |
          sudo apt-get install -y imagemagick
          for dir in directory/images/mdsh directory/images/ms directory/images/phd; do
            find "$dir" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
              -exec mogrify -quality 75 -resize "800x800>" {} \;
          done
          
      - name: Compress directory homepage images
        run: |
          sudo apt-get install -y imagemagick
          for dir in directory/images/directory_home; do
            find "$dir" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
              -exec mogrify -quality 80 -resize "1600x1600>" {} \;
          done
          
      - name: Update cache checksums after compression
        run: |
          Rscript -e '
          library(jsonlite)
          library(here)
          here::i_am("directory/make_profiles.R")
          cache_file <- here("directory/.image_cache.json")
          if (file.exists(cache_file)) {
            cache <- fromJSON(cache_file)
            for (file_id in names(cache)) {
              entry <- cache[[file_id]]
              # Skip old-format entries (plain strings, not lists)
              if (!is.list(entry)) next
              if (!is.null(entry$path) && file.exists(entry$path)) {
                cache[[file_id]]$local_md5 <- tools::md5sum(entry$path)[[1]]
              }
            }
            write_json(cache, cache_file, auto_unbox = TRUE)
            cat("Cache checksums updated\n")
          }
          '
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Render Quarto site
        run: quarto render
        
      - name: Build directory index
        run: Rscript directory/build_directory_index.R

      - name: Commit profiles and directory index
        id: commit_index
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add directory/profiles/
          git add about/directory-index.js
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update student directory profiles and index"
            git pull --rebase origin main --autostash
            git push origin main
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          
          
      #  ---- save cache after compression ----
      - name: Save images cache
        uses: actions/cache/save@v4
        with:
          path: |
            directory/images
            directory/.image_cache.json
          key: directory-images-${{ github.run_id }}

      - name: Commit and push .qmd profiles
        id: commit_profiles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Only stage the profile files
          git add directory/profiles/*.qmd
          
          # Check if there are any STAGED changes (ignores the modified images)
          if git diff --cached --quiet; then
            echo "No profile changes to commit"
          else
            git commit -m "Auto-update student directory profiles"
            git pull --rebase origin main --autostash
            git push origin main
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Publish to GitHub Pages (Action)
        if: ${{ steps.commit_index.outputs.changes_pushed == 'true' || steps.commit_profiles.outputs.changes_pushed == 'true' || github.event.inputs.force_publish == 'true' }}
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
