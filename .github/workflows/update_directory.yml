name: Update and Build Biostatistics Student Directory

on:
  # Publish all site changes (including static files such as newsletters)
  # as soon as they reach the production branch.
  push:
    branches:
      - main
  schedule:
    # Runs daily at 06:59 UTC (11:59 pm Pacific during daylight saving time).
    - cron: '59 6 * * *'
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'Force re-download all images'
        type: boolean
        default: false
      force_publish:
        description: 'Force publish to GitHub Pages even without new commits'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.DIRECTORY_BOT_APP_ID }}
          private_key: ${{ secrets.DIRECTORY_BOT_APP_PRIVATE_KEY }}
          
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }} 
          fetch-depth: 0
          
      # ---- restore cache ----
      - name: Restore images cache
        if: ${{ github.event.inputs.force_redownload != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            directory/images
            directory/.image_cache.json
          key: directory-images-${{ github.run_id }}
          restore-keys: |
            directory-images-
            
       # ---- clear cache if force redownload ----
      - name: Clear images for force redownload
        if: ${{ github.event.inputs.force_redownload == 'true' }}
        run: |
          rm -rf directory/images/mdsh
          rm -rf directory/images/ms
          rm -rf directory/images/phd
          rm -rf directory/images/mdsh-alumni
          rm -rf directory/images/ms-alumni
          rm -rf directory/images/phd-alumni
          rm -f directory/.image_cache.json

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::googledrive
            any::googlesheets4
            any::glue
            any::dotenv
            any::here
            any::writexl
            any::readxl
            any::jsonlite
          cache-version: 1

      - name: Run R script to generate profiles
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
          STUDENT_DIRECTORY_URL: ${{ secrets.STUDENT_DIRECTORY_URL }}
          ALUMNI_URL: ${{ secrets.ALUMNI_URL }}
        run: Rscript directory/make_profiles.R
        
      - name: Compress images in directory
        run: |
          sudo apt-get install -y imagemagick
          for dir in directory/images/mdsh directory/images/ms directory/images/phd \
                     directory/images/mdsh-alumni directory/images/ms-alumni directory/images/phd-alumni; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
              -exec mogrify -quality 75 -resize "800x800>" {} \;
          done
          
      - name: Update cache checksums after compression
        run: |
          Rscript -e '
          library(jsonlite)
          library(here)
          here::i_am("directory/make_profiles.R")
          cache_file <- here("directory/.image_cache.json")
          if (file.exists(cache_file)) {
            cache <- fromJSON(cache_file)
            for (file_id in names(cache)) {
              entry <- cache[[file_id]]
              # Skip old-format entries (plain strings, not lists)
              if (!is.list(entry)) next
              if (!is.null(entry$path) && file.exists(entry$path)) {
                cache[[file_id]]$local_md5 <- tools::md5sum(entry$path)[[1]]
              }
            }
            write_json(cache, cache_file, auto_unbox = TRUE)
            cat("Cache checksums updated\n")
          }
          '
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Quarto only writes the pages it renders. Start from the current site so
      # unaffected pages remain available when this run renders a small subset.
      - name: Check out the current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .previous-site
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 1

      - name: Restore the current published site
        run: rsync -a --delete --exclude='.git' .previous-site/ docs/

      - name: Detect directory changes
        id: changes
        shell: bash
        run: |
          changed_profiles="$RUNNER_TEMP/changed-profiles.txt"
          deleted_profiles="$RUNNER_TEMP/deleted-profiles.txt"

          {
            git diff --name-only --diff-filter=ACMR -- directory/profiles
            git ls-files --others --exclude-standard -- directory/profiles
          } | sort -u > "$changed_profiles"
          git diff --name-only --diff-filter=D -- directory/profiles > "$deleted_profiles"

          profiles_changed=false
          if [[ -s "$changed_profiles" || -s "$deleted_profiles" ]]; then
            profiles_changed=true
          fi
          echo "profiles_changed=$profiles_changed" >> "$GITHUB_OUTPUT"

          # The statistics JSON is generated on every run but is not tracked on
          # main. Its contents are embedded in the dashboard HTML, so compare
          # against that deployed page to avoid rebuilding it unnecessarily.
          stats_changed=false
          stats_marker="var STUDENT_DATA = $(cat stats/student_stats.json);</script>"
          if [[ ! -f docs/stats/stats.html ]] || ! grep -Fq "$stats_marker" docs/stats/stats.html; then
            stats_changed=true
          fi
          echo "stats_changed=$stats_changed" >> "$GITHUB_OUTPUT"

          # A main-branch push, or an explicitly forced publish, must rebuild
          # every page and copy every static asset. Scheduled directory runs
          # stay incremental when there are no relevant changes.
          full_site_build=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            || [[ "${{ github.event.inputs.force_publish }}" == "true" ]]; then
            full_site_build=true
          fi
          echo "full_site_build=$full_site_build" >> "$GITHUB_OUTPUT"

          if [[ "$full_site_build" == "true" || "$profiles_changed" == "true" || "$stats_changed" == "true" ]] \
            || [[ "${{ github.event.inputs.force_redownload }}" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync directory images into the site output
        if: ${{ steps.changes.outputs.should_publish == 'true' }}
        run: rsync -a directory/images/ docs/directory/images/

      - name: Render Quarto site
        if: ${{ steps.changes.outputs.full_site_build == 'true' || steps.changes.outputs.profiles_changed == 'true' || steps.changes.outputs.stats_changed == 'true' }}
        shell: bash
        run: |
          if [[ "${{ steps.changes.outputs.full_site_build }}" == "true" ]]; then
            quarto render
            exit 0
          fi

          changed_profiles="$RUNNER_TEMP/changed-profiles.txt"
          deleted_profiles="$RUNNER_TEMP/deleted-profiles.txt"
          render_targets=()

          # Remove output for profiles deleted by the source generator.
          while IFS= read -r profile; do
            [[ -z "$profile" ]] && continue
            output="docs/${profile%.qmd}.html"
            rm -f "$output"
            rm -rf "${output%.html}_files"
          done < "$deleted_profiles"

          if [[ "${{ steps.changes.outputs.profiles_changed }}" == "true" ]]; then
            while IFS= read -r profile; do
              [[ -z "$profile" ]] && continue
              [[ -f "$profile" ]] && render_targets+=("$profile")
            done < "$changed_profiles"

            # Listings depend on the set and metadata of profile files.
            render_targets+=(directory/*.qmd)
          fi

          if [[ "${{ steps.changes.outputs.stats_changed }}" == "true" ]]; then
            render_targets+=(stats/stats.qmd)
          fi

          # Render targets one at a time: with a multi-file invocation Quarto
          # resolves later relative paths from the first document's directory.
          for target in "${render_targets[@]}"; do
            quarto render "$target"
          done

      - name: Build directory index
        if: ${{ steps.changes.outputs.profiles_changed == 'true' }}
        run: Rscript directory/build_directory_index.R

      - name: Commit profiles and directory index
        id: commit_index
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A directory/profiles about/directory-index.js
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update student directory profiles and index"
            git pull --rebase origin main --autostash
            git push origin main
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          
          
      #  ---- save cache after compression ----
      - name: Save images cache
        uses: actions/cache/save@v4
        with:
          path: |
            directory/images
            directory/.image_cache.json
          key: directory-images-${{ github.run_id }}

      - name: Publish to GitHub Pages (Action)
        if: ${{ steps.changes.outputs.should_publish == 'true' }}
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
